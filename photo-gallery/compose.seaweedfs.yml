services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    restart: unless-stopped

volumes:
  seaweed-data:
